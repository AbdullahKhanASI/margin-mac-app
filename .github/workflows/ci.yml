name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build Margin.app
        run: ./build.sh release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Margin-${{ github.sha }}
          path: build/Margin-v*.zip
          retention-days: 14
